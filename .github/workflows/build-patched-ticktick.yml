name: Build and Release Patched TickTick

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Direct URL to your original TickTick.exe file"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Patched TickTick
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download TickTick Setup
        shell: pwsh
        run: |
          Write-Host "Downloading target file from ${{ inputs.app_url }}..."
          Invoke-WebRequest -Uri "${{ inputs.app_url }}" -OutFile "TickTick.exe"

      - name: Verify downloaded file is a PE executable
        shell: pwsh
        run: |
          $file = Get-Item -Path "TickTick.exe"
          Write-Host "Downloaded file size: $($file.Length) bytes"
          $fs = [System.IO.File]::OpenRead("TickTick.exe")
          try {
            $b1 = $fs.ReadByte()
            $b2 = $fs.ReadByte()
            if ($b1 -ne 0x4D -or $b2 -ne 0x5A) {
              Write-Error ( "Downloaded file does not have 'MZ' header (not a PE). First bytes: 0x{0:X2} 0x{1:X2}" -f $b1, $b2 )
              Write-Host "---- first 512 bytes (as utf8) ----"
              $raw = Get-Content -Raw -Path "TickTick.exe" -Encoding UTF8 -ErrorAction SilentlyContinue
              if ($raw) {
                Write-Host $raw.Substring(0, [Math]::Min(512, $raw.Length))
              }
              exit 1
            }
            else {
              Write-Host "TickTick.exe appears to be a PE executable (MZ header OK)."
            }
          } finally {
            $fs.Dispose()
          }

      - name: Run Patcher
        # We can just build and run directly via dotnet run
        run: dotnet run -- "TickTick.exe"

      - name: Diagnostic - list files after patcher
        shell: pwsh
        run: |
          Write-Host "Working directory: $(Get-Location)"
          Write-Host "Files in repo root:"
          Get-ChildItem -Force | Sort-Object Length -Descending | Format-Table Name,Length -AutoSize
          if (Test-Path "TickTick_Patched.exe") {
            Write-Host "TickTick_Patched.exe exists:"
            Get-Item "TickTick_Patched.exe" | Format-List Name,Length,FullName
            Get-FileHash -Path "TickTick_Patched.exe" -Algorithm SHA256
          } else {
            Write-Host "TickTick_Patched.exe not found. Looking for any *_Patched.* files..."
            Get-ChildItem -Filter "*_Patched.*" -Recurse | Format-Table FullName,Length -AutoSize
          }

      - name: Prepare Release Package
        shell: pwsh
        run: |
          if (-not (Test-Path "TickTick_Patched.exe")) {
            Write-Error "Patching failed: TickTick_Patched.exe not generated."
            exit 1
          }
          Compress-Archive -Path "TickTick_Patched.exe" -DestinationPath "TickTick_Patched.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Patched TickTick (${{ github.run_number }})
          files: TickTick_Patched.zip
          draft: true

      - name: Output Release URL
        shell: pwsh
        run: |
          Write-Host "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
